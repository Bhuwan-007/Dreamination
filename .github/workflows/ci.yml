name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test-api:
    name: API (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/shared
          pip install -r apps/api/requirements.txt
          pip install ruff pytest

      - name: Lint with ruff
        run: ruff check apps/api

      - name: Test with pytest
        run: pytest apps/api/tests || true

  lint-and-test-web:
    name: Web (Next.js 14)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint Next.js
        working-directory: apps/web
        run: npm run lint

      - name: Build Next.js
        working-directory: apps/web
        run: npm run build
