<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Dream Machine">
  <defs>
    <linearGradient id="icon-light" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#F3DDA6" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E2B866" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="16" fill="#090D11"/>
  <!-- Light through the arched portal -->
  <path d="M16 54V27a16 16 0 0 1 32 0v27z" fill="url(#icon-light)"/>
  <!-- Sun ring / halo -->
  <circle cx="34" cy="24" r="6" fill="none" stroke="#E2B866" stroke-width="1.5"/>
  <!-- Floating fantasy island -->
  <path d="M26 33h16l-3 3h-10z" fill="#E2B866" opacity="0.8"/>
  <!-- Traveler silhouette -->
  <circle cx="32" cy="43" r="2.6" fill="#090D11"/>
  <path d="M27.5 54c0-7 2-10.5 4.5-10.5s4.5 3.5 4.5 10.5z" fill="#090D11"/>
  <!-- Outer Arch frame -->
  <path d="M16 54V27a16 16 0 0 1 32 0v27" fill="none" stroke="#E2B866" stroke-width="1.5"/>
  <!-- Door leaf slightly ajar -->
  <path d="M16 54V27l-6 3v20z" fill="#E2B866" opacity="0.55"/>
  <!-- Ground threshold line -->
  <path d="M10 54h44" stroke="#E2B866" stroke-width="1.5" stroke-linecap="round"/>
</svg>

