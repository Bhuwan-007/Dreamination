# config/render.yaml: Camera Shot Catalog and Render Profiles for The Dream Machine
# Defines deterministic framing presets so LLM directors never compute 3D geometry or math.

profiles:
  preview:
    resolution: [1920, 1080]
    target_fps: 60
    dpr_cap: 1.5
    antialias: true
    power_preference: "high-performance"

  export:
    resolution: [1920, 1080]
    target_fps: 30
    fixed_timestep: 0.03333333333333333 # 1/30s
    video_bitrate: 8000000 # 8 Mbps
    audio_sample_rate: 44100
    format: "mp4"

shots:
  wide:
    name: "Wide Establishing"
    fov: 42
    distance: 9.5
    height: 3.2
    target_offset: [0.0, 0.8, 0.0]
    drift:
      speed: 0.0003
      amplitude_x: 0.35
      amplitude_y: 0.12
    description: "Vast landscape shot dwarfing the traveler against the horizon."

  hero_low:
    name: "Hero Low Angle"
    fov: 38
    distance: 4.2
    height: 0.6
    target_offset: [0.0, 1.1, 0.0]
    drift:
      speed: 0.0004
      amplitude_x: 0.15
      amplitude_y: 0.08
    description: "Low-angle cinematic framing looking up at the traveler."

  close_up:
    name: "Intimate Close-Up"
    fov: 32
    distance: 2.2
    height: 1.45
    target_offset: [0.0, 1.4, 0.0]
    drift:
      speed: 0.0002
      amplitude_x: 0.08
      amplitude_y: 0.05
    description: "Focused view on the traveler's face and visemes."

  tracking:
    name: "Dynamic Tracking"
    fov: 40
    distance: 5.5
    height: 1.8
    target_offset: [0.0, 0.9, 0.0]
    drift:
      speed: 0.0005
      amplitude_x: 0.25
      amplitude_y: 0.1
    description: "Camera smoothly follows actor locomotion along path."

  over_shoulder:
    name: "Over The Shoulder"
    fov: 35
    distance: 2.8
    height: 1.6
    target_offset: [0.4, 1.3, 0.0]
    drift:
      speed: 0.0003
      amplitude_x: 0.1
      amplitude_y: 0.06
    description: "Subject framed past an occluding shoulder or doorway edge."

  dolly_in:
    name: "Slow Dolly In"
    fov: 38
    distance: 6.0
    height: 1.5
    target_offset: [0.0, 1.0, 0.0]
    drift:
      speed: 0.0006
      amplitude_x: 0.05
      amplitude_y: 0.05
      dolly_rate: -0.15
    description: "Hypnotic forward push toward the focal subject."

