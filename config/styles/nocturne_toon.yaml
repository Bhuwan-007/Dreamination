# config/styles/nocturne_toon.yaml: Nocturne Cel-Shaded Style Preset
# Derived from Reference 1 (Night Void) and Design.md Section 11

id: nocturne_toon
name: "Nocturne Halo"
description: "Forest night surfaces with mist, sage, and warm lantern gold accents under a ring of stars."

toon:
  bands: 3
  ramp:
    - "#090D11" # Shadow: Void
    - "#282E31" # Midtone: Graphite
    - "#878781" # Highlight: Ash light
  rim_color: "#E2B866" # Lantern gold edge rim light
  rim_power: 3.5

outline:
  color: "#090D11"
  width: 2.0
  use_inverted_hull: true

palette:
  void: "#090D11"
  forest_night: "#0C1C17"
  slate: "#151A1E"
  graphite: "#282E31"
  ash: "#4B5151"
  cloud: "#E9EAEB"
  mist: "#BDCEBC"
  sage: "#77917F"
  lantern: "#E2B866"
  lantern_soft: "#F3DDA6"
  viridian: "#437666"

fog:
  density: 0.035
  color: "#0C1C17" # Forest night exponential fog

lighting:
  ambient:
    color: "#1B2A4A"
    intensity: 0.65
  key:
    color: "#E2B866" # Warm lantern sunlight/moonlight
    intensity: 1.4
    position: [4.0, 6.0, 3.0]
  fill:
    color: "#559CA9" # Cool lake bounce
    intensity: 0.35
    position: [-3.0, 2.0, -2.0]

post:
  grain: 0.04
  bloom: 0.25
  vignette: 0.35
  contrast: 1.05

sky:
  preset: "night_halo"
  zenith: "#090D11"
  horizon: "#0C1C17"
  star_count: 350
  star_color: "#F3DDA6"
  halo_radius: 12.0
  halo_color: "#E2B866"

image_style_prompt: "painterly digital illustration with soft hand-painted textures, starry night void, ring of golden stars, dark reflective water, restrained palette of forest-night green-black, mist and lantern gold"
negative_prompt: "people, faces, text, watermark, signature, frame, border, photorealism, neon, purple"

